    <style>
        [v-cloak] { display: none; }
        
        :root {
            --bg-primary: #EEEEEE;
            --card-bg: #FFFFFF;
            --card-inner-bg: #F4F4F6;
            --border-color: #E5E7EB;
            --text-primary: #111827;
            --text-muted: #6B7280;
            --accent-amber: #F59E0B;
        }

        html.dark {
            --bg-primary: #030302;
            --card-bg: #0D0E11;
            --card-inner-bg: #16181D;
            --border-color: #262626;
            --text-primary: #F9FAFB;
            --text-muted: #9CA3AF;
            --accent-amber: #F59E0B;
            background-color: #030302;
            color: #F9FAFB;
        }

        html:not(.dark) {
            background-color: #EEEEEE;
            color: #111827;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }

        .num-font {
            font-family: "JetBrains Mono", monospace;
            font-feature-settings: "tnum" 1;
            letter-spacing: -0.02em;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #4B5563; }

        :focus-visible {
            outline: 2px solid #F59E0B;
            outline-offset: 2px;
        }

        .skeleton {
            background: linear-gradient(90deg, rgba(229, 231, 235, 0.6) 25%, rgba(243, 244, 246, 0.95) 50%, rgba(229, 231, 235, 0.6) 75%);
            background-size: 200% 100%;
            animation: skeleton-shimmer 1.4s ease-in-out infinite;
        }
        .dark .skeleton {
            background: linear-gradient(90deg, rgba(22, 24, 29, 0.65) 25%, rgba(38, 38, 38, 0.9) 50%, rgba(22, 24, 29, 0.65) 75%);
            background-size: 200% 100%;
        }
        @keyframes skeleton-shimmer {
            from { background-position: 200% 0; }
            to { background-position: -200% 0; }
        }

        .toast-enter {
            animation: toast-in 180ms cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        @keyframes toast-in {
            from { opacity: 0; transform: translateY(12px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
