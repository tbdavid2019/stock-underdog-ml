<!-- ================= TOP NAVIGATION BAR (BALANCED 3-COLUMN EQUILIBRIUM) ================= -->
<header class="sticky top-0 z-50 border-b transition-colors duration-200"
        :class="isDark ? 'bg-[#0D0E11]/95 backdrop-blur-md border-[#262626]' : 'bg-[#FFF9E8]/95 backdrop-blur-md border-[#DDC58B] shadow-sm'">
    <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 h-14 sm:h-16 flex items-center justify-between gap-2 sm:gap-4">

        <!-- 1. LEFT COLUMN: 888 STOCK QUANT Badge Logo (2md.aiurl.tw Style) -->
        <div class="flex items-center cursor-pointer select-none shrink-0 group"
             @click="setTab('dashboard')"
             title="返回操盤看板首頁"
             role="button"
             aria-label="888 StockQuant 首頁">
            <div class="w-11 h-11 sm:w-12 sm:h-12 rounded-xl bg-[#FFB010] text-[#2B251A] border-2 border-[#2B251A] shadow-sm flex flex-col items-center justify-center p-1 transition-all duration-200 group-hover:bg-[#F2A600] group-hover:-translate-y-0.5 group-active:scale-95 select-none">
                <span class="font-black text-[13px] sm:text-[14px] tracking-tight leading-none text-[#2B251A] font-mono">888</span>
                <span class="font-black text-[8px] sm:text-[9px] tracking-tighter uppercase leading-none mt-0.5 text-[#2B251A]">STOCK</span>
                <span class="font-black text-[8px] sm:text-[9px] tracking-tighter uppercase leading-none mt-0.5 text-[#2B251A]">QUANT</span>
            </div>
        </div>

        <!-- 2. CENTER COLUMN: Core Navigation Tabs (Centered Balance with Material Icons) -->
        <div class="flex-1 hidden md:flex justify-center px-1">
            <nav class="flex items-center space-x-1 p-1 rounded-full border transition-colors shadow-sm"
                 :class="isDark ? 'bg-[#16181D] border-[#262626]' : 'bg-[#17324D] border-[#17324D] shadow-md'">
                <button @click="setTab('dashboard')" :aria-current="activeTab === 'dashboard' ? 'page' : undefined"
                        :class="activeTab === 'dashboard' ? 'bg-[#FFB010] text-[#2B251A] font-black shadow-sm' : (isDark ? 'text-[#9CA3AF] hover:text-white' : 'text-[#FFF9E8] hover:bg-white/10 hover:text-white')"
                        class="px-3.5 py-1.5 rounded-full text-sm font-bold whitespace-nowrap transition-all flex items-center space-x-1.5">
                    <span class="material-symbols-outlined text-[18px]">monitoring</span>
                    <span>操盤看板</span>
                </button>
                <button @click="setTab('institutional')" :aria-current="activeTab === 'institutional' ? 'page' : undefined"
                        :class="activeTab === 'institutional' ? 'bg-[#FFB010] text-[#2B251A] font-black shadow-sm' : (isDark ? 'text-[#9CA3AF] hover:text-white' : 'text-[#FFF9E8] hover:bg-white/10 hover:text-white')"
                        class="px-3.5 py-1.5 rounded-full text-sm font-bold whitespace-nowrap transition-all flex items-center space-x-1.5">
                    <span class="material-symbols-outlined text-[18px]">account_balance</span>
                    <span>法人籌碼</span>
                </button>
                <button @click="setTab('history')" :aria-current="activeTab === 'history' ? 'page' : undefined"
                        :class="activeTab === 'history' ? 'bg-[#FFB010] text-[#2B251A] font-black shadow-sm' : (isDark ? 'text-[#9CA3AF] hover:text-white' : 'text-[#FFF9E8] hover:bg-white/10 hover:text-white')"
                        class="px-3.5 py-1.5 rounded-full text-sm font-bold whitespace-nowrap transition-all flex items-center space-x-1.5">
                    <span class="material-symbols-outlined text-[18px]">history</span>
                    <span>個股歷史</span>
                </button>
                <button @click="setTab('industry_chain')" :aria-current="activeTab === 'industry_chain' ? 'page' : undefined"
                        :class="activeTab === 'industry_chain' ? 'bg-[#FFB010] text-[#2B251A] font-black shadow-sm' : (isDark ? 'text-[#9CA3AF] hover:text-white' : 'text-[#FFF9E8] hover:bg-white/10 hover:text-white')"
                        class="px-3.5 py-1.5 rounded-full text-sm font-bold whitespace-nowrap transition-all flex items-center space-x-1.5">
                    <span class="material-symbols-outlined text-[18px]">hub</span>
                    <span>產業圖譜</span>
                </button>
                <button @click="setTab('podcast')" :aria-current="activeTab === 'podcast' ? 'page' : undefined"
                        :class="activeTab === 'podcast' ? 'bg-[#FFB010] text-[#2B251A] font-black shadow-sm' : (isDark ? 'text-[#9CA3AF] hover:text-white' : 'text-[#FFF9E8] hover:bg-white/10 hover:text-white')"
                        class="px-3.5 py-1.5 rounded-full text-sm font-bold whitespace-nowrap transition-all flex items-center space-x-1.5">
                    <span class="material-symbols-outlined text-[18px]">podcasts</span>
                    <span>Podcast 雷達</span>
                </button>
                <button @click="setTab('discovery')" :aria-current="activeTab === 'discovery' ? 'page' : undefined"
                        :class="activeTab === 'discovery' ? 'bg-[#FFB010] text-[#2B251A] font-black shadow-sm' : (isDark ? 'text-[#9CA3AF] hover:text-white' : 'text-[#FFF9E8] hover:bg-white/10 hover:text-white')"
                        class="px-3.5 py-1.5 rounded-full text-sm font-bold whitespace-nowrap transition-all flex items-center space-x-1.5">
                    <span class="material-symbols-outlined text-[18px]">radar</span>
                    <span>前沿發現</span>
                </button>
            </nav>
        </div>

        <!-- 3. RIGHT COLUMN: System Status & User Actions (Sleek Icon Buttons, No Redundant Text) -->
        <div class="flex items-center space-x-2 shrink-0">
            <!-- Global Macro Pill (Hidden on Laptops / Small Screens to Avoid Crowding) -->
            <div class="hidden 2xl:flex items-center space-x-2 px-3 py-1.5 rounded-full border text-sm font-medium whitespace-nowrap transition-colors"
                 :class="isDark ? 'bg-[#16181D] border-[#262626] text-slate-300' : 'bg-[#FFFDF7] border-[#6B5B38] text-[#2B251A]'">
                <span class="w-2 h-2 rounded-full animate-pulse"
                      :class="macro.exposure === null || macro.exposure === undefined ? 'bg-slate-400' : (macro.exposure >= 0.8 ? 'bg-emerald-500' : 'bg-amber-500')"></span>
                <span :class="isDark ? 'text-[#9CA3AF]' : 'text-[#5C5038]'">大盤風控:</span>
                <span class="font-bold">{{ cleanRegimeName(macro.regime_name) }}</span>
                <span class="opacity-30">|</span>
                <span :class="isDark ? 'text-[#9CA3AF]' : 'text-[#5C5038]'">建議曝險:</span>
                <span class="font-black num-font text-amber-500">
                    {{ macro.exposure !== null && macro.exposure !== undefined ? (macro.exposure * 100).toFixed(0) + '%' : '—' }}
                </span>
            </div>

            <!-- Language Switcher Button (🌐 繁中 / EN) -->
            <button @click="toggleLocale()"
                    class="h-10 px-2.5 sm:px-3 rounded-full border transition-all flex items-center space-x-1 shadow-sm hover:scale-105 active:scale-95 text-xs font-bold select-none"
                    :class="isDark ? 'bg-[#16181D] border-[#262626] text-slate-300 hover:text-white hover:bg-[#262626]' : 'bg-[#FFFDF7] border-[#6B5B38] text-[#2B251A] hover:bg-[#FFF0CC]'"
                    :title="currentLocale === 'zh' ? '切換為 English' : '切換為繁體中文'" aria-label="切換語言">
                <span class="material-symbols-outlined text-[18px]">language</span>
                <span class="tracking-tight">{{ currentLocale === 'zh' ? '繁中' : 'EN' }}</span>
            </button>

            <!-- Share URL Icon Button -->
            <button @click="copyShareLink()"
                    class="w-10 h-10 rounded-full border transition-all flex items-center justify-center shadow-sm hover:scale-105 active:scale-95"
                    :class="isDark ? 'bg-[#16181D] border-[#262626] text-amber-400 hover:bg-[#262626] hover:text-amber-300' : 'bg-[#FFFDF7] border-[#6B5B38] text-[#2B251A] hover:bg-[#FFF0CC]'"
                    title="複製目前頁面完整分享連結" aria-label="分享連結">
                <span class="material-symbols-outlined text-[20px]">share</span>
            </button>

            <!-- Dark / Light Mode Switcher (Pure Icon Button, No Verbose Text) -->
            <button @click="toggleTheme()"
                    class="w-10 h-10 rounded-full border transition-all flex items-center justify-center shadow-sm select-none hover:scale-105 active:scale-95"
                    :class="isDark ? 'bg-[#16181D] border-[#262626] text-amber-400 hover:bg-[#262626]' : 'bg-[#FFFDF7] border-[#6B5B38] text-[#2B251A] hover:bg-[#FFF0CC]'"
                    :title="isDark ? '切換為淺色模式' : '切換為曜石黑深色模式'"
                    :aria-label="isDark ? '切換為淺色模式' : '切換為深色模式'">
                <span class="material-symbols-outlined text-[20px]">{{ isDark ? 'light_mode' : 'dark_mode' }}</span>
            </button>
        </div>

    </div>
</header>

<!-- ================= FIXED BOTTOM NAVIGATION BAR (MOBILE NATIVE APP BAR) ================= -->
<nav class="fixed bottom-0 inset-x-0 z-40 md:hidden border-t backdrop-blur-lg transition-colors select-none"
     :class="isDark ? 'border-[#262626] bg-[#0D0E11]/95 shadow-2xl shadow-black' : 'border-[#17324D] bg-[#17324D]/95 shadow-lg'"
     style="padding-bottom: env(safe-area-inset-bottom, 0px);"
     aria-label="行動版底部分頁導覽">
    <div class="flex overflow-x-auto no-scrollbar gap-1 px-2 py-1.5" style="-webkit-overflow-scrolling: touch;">
        <button @click="setTab('dashboard')"
                :aria-current="activeTab === 'dashboard' ? 'page' : undefined"
                :class="activeTab === 'dashboard' ? 'bg-[#FFB010] text-[#2B251A] font-black shadow-sm' : (isDark ? 'text-[#9CA3AF] hover:text-white' : 'text-[#FFF9E8]/90 hover:text-white')"
                class="min-h-[48px] py-1.5 px-2 rounded-xl text-xs font-bold transition-all flex flex-col items-center justify-center gap-0.5 text-center select-none flex-1 min-w-[64px] shrink-0">
            <span class="material-symbols-outlined text-[20px] leading-none">monitoring</span>
            <span class="truncate">操盤看板</span>
        </button>
        <button @click="setTab('institutional')"
                :aria-current="activeTab === 'institutional' ? 'page' : undefined"
                :class="activeTab === 'institutional' ? 'bg-[#FFB010] text-[#2B251A] font-black shadow-sm' : (isDark ? 'text-[#9CA3AF] hover:text-white' : 'text-[#FFF9E8]/90 hover:text-white')"
                class="min-h-[48px] py-1.5 px-2 rounded-xl text-xs font-bold transition-all flex flex-col items-center justify-center gap-0.5 text-center select-none flex-1 min-w-[64px] shrink-0">
            <span class="material-symbols-outlined text-[20px] leading-none">account_balance</span>
            <span class="truncate">法人籌碼</span>
        </button>
        <button @click="setTab('history')"
                :aria-current="activeTab === 'history' ? 'page' : undefined"
                :class="activeTab === 'history' ? 'bg-[#FFB010] text-[#2B251A] font-black shadow-sm' : (isDark ? 'text-[#9CA3AF] hover:text-white' : 'text-[#FFF9E8]/90 hover:text-white')"
                class="min-h-[48px] py-1.5 px-2 rounded-xl text-xs font-bold transition-all flex flex-col items-center justify-center gap-0.5 text-center select-none flex-1 min-w-[64px] shrink-0">
            <span class="material-symbols-outlined text-[20px] leading-none">history</span>
            <span class="truncate">個股歷史</span>
        </button>
        <button @click="setTab('industry_chain')"
                :aria-current="activeTab === 'industry_chain' ? 'page' : undefined"
                :class="activeTab === 'industry_chain' ? 'bg-[#FFB010] text-[#2B251A] font-black shadow-sm' : (isDark ? 'text-[#9CA3AF] hover:text-white' : 'text-[#FFF9E8]/90 hover:text-white')"
                class="min-h-[48px] py-1.5 px-2 rounded-xl text-xs font-bold transition-all flex flex-col items-center justify-center gap-0.5 text-center select-none flex-1 min-w-[64px] shrink-0">
            <span class="material-symbols-outlined text-[20px] leading-none">hub</span>
            <span class="truncate">產業圖譜</span>
        </button>
        <button @click="setTab('podcast')"
                :aria-current="activeTab === 'podcast' ? 'page' : undefined"
                :class="activeTab === 'podcast' ? 'bg-[#FFB010] text-[#2B251A] font-black shadow-sm' : (isDark ? 'text-[#9CA3AF] hover:text-white' : 'text-[#FFF9E8]/90 hover:text-white')"
                class="min-h-[48px] py-1.5 px-2 rounded-xl text-xs font-bold transition-all flex flex-col items-center justify-center gap-0.5 text-center select-none flex-1 min-w-[64px] shrink-0">
            <span class="material-symbols-outlined text-[20px] leading-none">podcasts</span>
            <span class="truncate">Podcast</span>
        </button>
        <button @click="setTab('discovery')"
                :aria-current="activeTab === 'discovery' ? 'page' : undefined"
                :class="activeTab === 'discovery' ? 'bg-[#FFB010] text-[#2B251A] font-black shadow-sm' : (isDark ? 'text-[#9CA3AF] hover:text-white' : 'text-[#FFF9E8]/90 hover:text-white')"
                class="min-h-[48px] py-1.5 px-2 rounded-xl text-xs font-bold transition-all flex flex-col items-center justify-center gap-0.5 text-center select-none flex-1 min-w-[64px] shrink-0">
            <span class="material-symbols-outlined text-[20px] leading-none">radar</span>
            <span class="truncate">前沿發現</span>
        </button>
    </div>
</nav>
