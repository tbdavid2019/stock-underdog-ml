<!-- ================= FOOTER & FLOATING OVERLAYS (FIGMA FACELIFT V.1) ================= -->
<footer class="border-t py-6 text-xs transition-colors duration-200 mt-12"
        :class="isDark ? 'bg-[#0D0E11] border-[#262626] text-[#9CA3AF]' : 'bg-white border-[#E5E7EB] text-slate-500'">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row items-center justify-between gap-4">

        <!-- Left: Copyright & Tech Provider Pill -->
        <div class="flex flex-wrap items-center gap-3">
            <span class="font-sans">© 2026 888 StockQuant.</span>
            <a href="https://david888.com" target="_blank"
               class="px-2.5 py-1 rounded-lg border text-xs font-bold transition-all flex items-center space-x-1.5"
               :class="isDark ? 'bg-[#16181D] border-[#262626] text-amber-400 hover:text-white hover:border-amber-500' : 'bg-[#F4F4F6] border-[#E5E7EB] text-amber-700 hover:bg-white shadow-sm'">
                <span class="material-symbols-outlined text-[15px] leading-none">bolt</span>
                <span>技術提供 <strong class="underline decoration-dotted font-black num-font">david888.com</strong></span>
                <span class="material-symbols-outlined text-[12px] leading-none">open_in_new</span>
            </a>
        </div>

        <!-- Right: Developer Center & Navigation Shortcuts -->
        <div class="flex flex-wrap items-center justify-center gap-2 sm:gap-3">
            <!-- Agent / MCP Hub Button -->
            <button @click="setTab('agent_hub'); window.scrollTo({top: 0, behavior: 'smooth'})"
                    class="px-2.5 py-1 rounded-lg border text-xs font-bold transition-all flex items-center space-x-1.5 shadow-sm"
                    :class="activeTab === 'agent_hub' ? (isDark ? 'bg-amber-500 text-black border-amber-500 font-black' : 'bg-amber-500 text-white border-amber-500 font-black') : (isDark ? 'bg-[#16181D] border-[#262626] text-amber-400 hover:text-white hover:border-amber-500' : 'bg-[#F4F4F6] border-[#E5E7EB] text-slate-700 hover:bg-white')"
                    title="切換至 AI Agent 與 MCP 工具中心">
                <span class="material-symbols-outlined text-[16px] leading-none">smart_toy</span>
                <span>Agent / MCP Hub</span>
            </button>

            <!-- llms.txt Standard Badge -->
            <a href="/llms.txt" target="_blank"
               class="px-2.5 py-1 rounded-lg border text-xs font-bold transition-all flex items-center space-x-1 shadow-sm"
               :class="isDark ? 'bg-[#16181D] border-[#262626] text-emerald-400 hover:text-emerald-300 hover:border-emerald-500' : 'bg-emerald-50 border-emerald-200 text-emerald-800 hover:bg-emerald-100'"
               title="LLM Context Standard (https://llmstxt.org)">
                <span class="material-symbols-outlined text-[15px] leading-none">description</span>
                <span>llms.txt</span>
                <span class="material-symbols-outlined text-[12px] leading-none">open_in_new</span>
            </a>

            <!-- API Docs / Endpoints -->
            <div class="flex items-center space-x-3 num-font pl-1">
                <a href="/docs" target="_blank" class="hover:underline transition-all font-bold" :class="isDark ? 'text-slate-300 hover:text-amber-400' : 'text-slate-700 hover:text-amber-600'">Swagger UI</a>
                <a href="/redoc" target="_blank" class="hover:underline transition-all font-bold" :class="isDark ? 'text-slate-300 hover:text-amber-400' : 'text-slate-700 hover:text-amber-600'">ReDoc</a>
                <a href="/skill" target="_blank" class="hover:underline transition-all font-bold" :class="isDark ? 'text-slate-300 hover:text-amber-400' : 'text-slate-700 hover:text-amber-600'">SKILL.md</a>
            </div>

            <!-- Back to top -->
            <button @click="window.scrollTo({top: 0, behavior: 'smooth'})"
                    class="p-1 rounded-lg border text-xs transition-all ml-1 flex items-center justify-center"
                    :class="isDark ? 'bg-[#16181D] border-[#262626] text-slate-400 hover:text-white' : 'bg-white border-[#E5E7EB] text-slate-500 hover:text-slate-900 shadow-sm'"
                    title="回到頂部" aria-label="回到頂部">
                <span class="material-symbols-outlined text-[16px] leading-none">arrow_upward</span>
            </button>
        </div>

    </div>
</footer>

<!-- ================= FLOATING COMPANY PROFILE HOVER CARD (2MD POWERED) ================= -->
<template v-if="hoverVisible">
<div class="fixed z-50 pointer-events-auto transition-all duration-150 shadow-2xl rounded-2xl border p-4 max-w-sm w-96 backdrop-blur-xl"
     :style="{ top: hoverPos.top + 'px', left: hoverPos.left + 'px' }"
     @mouseenter="clearHoverTimeout()"
     @mouseleave="hideCompanyHover(true)"
     :class="isDark ? 'bg-[#0D0E11]/95 border-[#262626] text-slate-100 shadow-black/80' : 'bg-white/95 border-[#E5E7EB] text-slate-800 shadow-2xl'">

    <!-- Loading Skeleton -->
    <div v-if="hoverLoading" class="space-y-3">
        <div class="flex items-center justify-between">
            <div class="skeleton h-6 w-36 rounded-lg"></div>
            <div class="skeleton h-4 w-16 rounded-md"></div>
        </div>
        <div class="skeleton h-14 w-full rounded-xl"></div>
        <div class="skeleton h-8 w-full rounded-lg"></div>
    </div>

    <!-- Loaded Content -->
    <div v-else-if="hoverData && hoverData.ticker" class="space-y-3">
        <!-- Header -->
        <div class="flex items-start justify-between gap-2 border-b pb-2.5" :class="isDark ? 'border-[#262626]' : 'border-[#E5E7EB]'">
            <div>
                <div class="flex items-center space-x-2">
                    <span class="text-lg font-black num-font text-amber-500">
                        {{ hoverData.ticker }}
                    </span>
                    <span class="text-base font-bold" :class="isDark ? 'text-white' : 'text-slate-900'">
                        {{ hoverData.name }}
                    </span>
                </div>
                <div class="flex flex-wrap items-center gap-1.5 mt-1">
                    <span class="px-2.5 py-0.5 text-xs font-semibold rounded-md border font-sans"
                          :class="isDark ? 'bg-amber-500/10 text-amber-400 border-amber-500/30' : 'bg-amber-100 text-amber-800 border-amber-300'">
                        {{ hoverData.industry || '綜合產業' }}
                    </span>
                    <span v-if="hoverData.market_cap" class="text-xs font-mono" :class="isDark ? 'text-[#9CA3AF]' : 'text-slate-500'">
                        市值: {{ hoverData.market_cap }}
                    </span>
                    <span v-if="hoverData.chairman" class="text-xs" :class="isDark ? 'text-[#9CA3AF]' : 'text-slate-500'">
                        董座: {{ hoverData.chairman }}
                    </span>
                </div>
            </div>
            <span class="text-xs px-2 py-0.5 rounded border text-emerald-400 border-emerald-500/30 bg-emerald-500/10 whitespace-nowrap shrink-0 font-mono flex items-center">
                <span class="material-symbols-outlined text-[13px] leading-none mr-0.5">bolt</span>
                <span>2md</span>
            </span>
        </div>

        <!-- Business Overview -->
        <div>
            <div class="text-xs sm:text-sm font-bold mb-1 flex items-center space-x-1" :class="isDark ? 'text-slate-300' : 'text-slate-800'">
                <span class="material-symbols-outlined text-[15px] leading-none text-amber-500">business</span>
                <span>主要業務與營運</span>
            </div>
            <p class="text-xs sm:text-sm leading-relaxed line-clamp-3" :class="isDark ? 'text-slate-300' : 'text-slate-700'">
                {{ hoverData.business_summary || '暫無詳細業務描述' }}
            </p>
        </div>

        <!-- Recent News (if any) -->
        <div v-if="hoverData.recent_news && hoverData.recent_news.length > 0" class="pt-2 border-t" :class="isDark ? 'border-[#262626]' : 'border-[#E5E7EB]'">
            <div class="text-xs sm:text-sm font-bold mb-1 flex items-center space-x-1" :class="isDark ? 'text-slate-300' : 'text-slate-800'">
                <span class="material-symbols-outlined text-[15px] leading-none text-amber-500">newspaper</span>
                <span>即時最新動態</span>
            </div>
            <div class="space-y-1.5">
                <a v-for="(news, nidx) in hoverData.recent_news.slice(0, 2)" :key="nidx"
                   :href="news.url" target="_blank"
                   class="block p-2 rounded-lg border text-xs leading-normal transition-all truncate hover:underline"
                   :class="isDark ? 'bg-[#16181D] border-[#262626] text-amber-300 hover:border-amber-500' : 'bg-[#F4F4F6] border-[#E5E7EB] text-amber-800 hover:bg-white'">
                    • {{ news.title }}
                </a>
            </div>
        </div>

        <!-- Corporate Network Quick Highlight (Taiwan Company Network) -->
        <div v-if="hoverData.company_network" class="pt-2 border-t space-y-1.5" :class="isDark ? 'border-[#262626]' : 'border-[#E5E7EB]'">
            <div class="text-xs sm:text-sm font-bold flex items-center justify-between" :class="isDark ? 'text-slate-300' : 'text-slate-800'">
                <div class="flex items-center space-x-1 text-amber-500">
                    <span class="material-symbols-outlined text-[15px] leading-none">account_tree</span>
                    <span>集團股權關係網絡</span>
                </div>
                <button @click="toggleRowDrawer(hoverData.ticker, 'network'); hideCompanyHover(true)"
                        class="text-xs text-amber-400 hover:underline flex items-center space-x-0.5">
                    <span>拓撲圖譜</span>
                    <span class="material-symbols-outlined text-[12px] leading-none">chevron_right</span>
                </button>
            </div>
            <div class="flex flex-wrap gap-1 items-center">
                <span v-for="up in (hoverData.company_network.relationships?.upstream || []).slice(0, 1)" :key="up.name"
                      class="px-2 py-0.5 rounded text-[11px] font-medium border"
                      :class="isDark ? 'bg-indigo-500/10 border-indigo-500/30 text-indigo-300' : 'bg-indigo-50 border-indigo-200 text-indigo-800'">
                    母: {{ up.name }}
                </span>
                <span v-for="down in (hoverData.company_network.relationships?.downstream || []).slice(0, 3)" :key="down.name"
                      class="px-2 py-0.5 rounded text-[11px] font-medium border"
                      :class="down.is_listed ? (isDark ? 'bg-emerald-500/10 border-emerald-500/30 text-emerald-300' : 'bg-emerald-50 border-emerald-200 text-emerald-800') : 'text-slate-400 border-slate-700'">
                    {{ down.name }}<strong v-if="down.code">({{ down.code }})</strong>
                </span>
                <span v-if="(hoverData.company_network.relationships?.downstream || []).length > 3" class="text-[11px] text-slate-400">
                    +{{ hoverData.company_network.relationships.downstream.length - 3 }} 關係企業
                </span>
            </div>
        </div>

        <!-- External Link Buttons -->
        <div class="pt-2 border-t flex flex-wrap items-center justify-between gap-1.5 text-xs font-bold" :class="isDark ? 'border-[#262626]' : 'border-[#E5E7EB]'">
            <button v-if="hoverData.company_network"
                    @click="toggleRowDrawer(hoverData.ticker, 'network'); hideCompanyHover(true)"
                    class="px-2 py-1 rounded-md border transition-all text-center flex-1 flex items-center justify-center space-x-0.5"
                    :class="isDark ? 'bg-amber-500/10 border-amber-500/30 text-amber-400 hover:bg-amber-500/20' : 'bg-amber-50 border-amber-200 text-amber-800 hover:bg-amber-100'"
                    title="在卡片中展開集團股權網絡與官方拓撲圖譜">
                <span class="material-symbols-outlined text-[13px] leading-none">account_tree</span>
                <span>集團網絡</span>
            </button>
            <button v-if="isTwStock(hoverData.ticker)"
                    @click="toggleRowDrawer(hoverData.ticker, 'tender'); hideCompanyHover(true)"
                    class="px-2 py-1 rounded-md border transition-all text-center flex-1 flex items-center justify-center space-x-0.5"
                    :class="isDark ? 'bg-emerald-500/10 border-emerald-500/30 text-emerald-400 hover:bg-emerald-500/20' : 'bg-emerald-50 border-emerald-200 text-emerald-800 hover:bg-emerald-100'"
                    title="在卡片中查看政府電子採購標案情資">
                <span class="material-symbols-outlined text-[13px] leading-none">gavel</span>
                <span>政府標案</span>
            </button>
            <a v-if="hoverData.links?.yahoo" :href="hoverData.links.yahoo" target="_blank" class="px-2 py-1 rounded-md border transition-all text-center flex-1 flex items-center justify-center space-x-0.5"
               :class="isDark ? 'bg-[#16181D] border-[#262626] text-slate-300 hover:text-white hover:border-amber-500' : 'bg-white border-[#E5E7EB] text-slate-700 hover:bg-[#F4F4F6]'">
                <span>Yahoo</span>
                <span class="material-symbols-outlined text-[12px] leading-none">open_in_new</span>
            </a>
            <a v-if="hoverData.links?.goodinfo" :href="hoverData.links.goodinfo" target="_blank" class="px-2 py-1 rounded-md border transition-all text-center flex-1 flex items-center justify-center space-x-0.5"
               :class="isDark ? 'bg-[#16181D] border-[#262626] text-slate-300 hover:text-white hover:border-amber-500' : 'bg-white border-[#E5E7EB] text-slate-700 hover:bg-[#F4F4F6]'">
                <span>Goodinfo</span>
                <span class="material-symbols-outlined text-[12px] leading-none">open_in_new</span>
            </a>
            <button @click="searchTickerHistory(hoverData.ticker); hideCompanyHover(true)" class="px-2 py-1 rounded-md border transition-all text-center flex-1 text-black bg-amber-500 hover:bg-amber-400 border-amber-500 flex items-center justify-center space-x-0.5">
                <span>時序軌跡</span>
                <span class="material-symbols-outlined text-[12px] leading-none">open_in_new</span>
            </button>
        </div>
    </div>
</div>
</template>

<!-- Toast Notification Pop-up -->
<template v-if="toastMessage">
    <div class="fixed bottom-6 right-6 px-4 py-2.5 text-black font-bold text-xs rounded-xl shadow-xl flex items-center space-x-2 transition-all z-50 toast-enter bg-amber-500 border border-amber-400">
        <span class="material-symbols-outlined text-[16px] leading-none">check_circle</span>
        <span>{{ toastMessage }}</span>
    </div>
</template>
