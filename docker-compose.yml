version: '3.8'

services:
  stock-ml:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stock-underdog-ml
    volumes:
      # 掛載環境變數配置 (唯讀)
      - ./.env:/app/.env:ro
      # 掛載日誌目錄
      - ./logs:/app/logs
      # 掛載行情快取目錄
      - ./cache:/app/cache
      - ./data/cache:/app/data/cache
      # 掛載本地 DuckDB 時序資料庫儲存目錄 (持久化備份)
      - ./data/storage:/app/data/storage
    environment:
      - TZ=Asia/Taipei
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    command: python main.py
