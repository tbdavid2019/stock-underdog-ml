# ==============================================================================
# Stock Prediction & Multi-Strategy Quantitative System
# Docker Compose Multi-Service Architecture
# ==============================================================================
version: '3.8'

# 通用服務模板
x-stock-service: &default-service
  image: ghcr.io/tbdavid2019/stock-underdog-ml:latest
  build:
    context: .
    dockerfile: Dockerfile
  volumes:
    # 唯讀環境變數
    - ./.env:/app/.env:ro
    # 應用程式日誌
    - ./logs:/app/logs
    # 行情快取與法人籌碼快取
    - ./cache:/app/cache
    - ./data/cache:/app/data/cache
    # 本地 DuckDB 列式時序庫持久化目錄
    - ./data/storage:/app/data/storage
  environment:
    - TZ=Asia/Taipei
    - PYTHONUNBUFFERED=1
    - TF_CPP_MIN_LOG_LEVEL=2

services:
  # 1. 預設執行服務 (單次執行全量日報)
  # 使用方式: docker compose run --rm stock-ml
  stock-ml:
    <<: *default-service
    container_name: stock-underdog-ml-runner
    command: ["main"]

  # 2. 自動排程服務 (常駐後台，依照 Asia/Taipei 時區定時自動執行)
  # 使用方式: docker compose up -d stock-ml-cron
  stock-ml-cron:
    <<: *default-service
    container_name: stock-underdog-ml-cron
    restart: unless-stopped
    command: ["cron"]

  # 3. Supabase ➔ DuckDB 全量資料庫同步遷移服務
  # 使用方式: docker compose run --rm stock-ml-sync
  stock-ml-sync:
    <<: *default-service
    container_name: stock-underdog-ml-sync
    command: ["sync"]

  # 4. 容器內單元測試服務
  # 使用方式: docker compose run --rm stock-ml-test
  stock-ml-test:
    <<: *default-service
    container_name: stock-underdog-ml-test
    command: ["test"]

  # 5. FastAPI 量化訊號 REST & MCP 服務 (對外提供 HTTP API 與 Swagger 交互式文檔)
  # 使用方式: docker compose up -d stock-ml-api
  stock-ml-api:
    <<: *default-service
    container_name: stock-underdog-ml-api
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      - TZ=Asia/Taipei
      - PYTHONUNBUFFERED=1
      - TF_CPP_MIN_LOG_LEVEL=2
      - API_PORT=8088
    command: ["api"]
