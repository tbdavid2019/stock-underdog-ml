name: yfinance Auto-Update & CI/CD Verification

permissions:
  contents: write
  pull-requests: write

on:
  schedule:
    # 每天 UTC 05:00 (台灣時間 13:00，台股收盤前 0.5hr 檢查)
    - cron: '0 5 * * 1-5'
  workflow_dispatch: # 支援手動一鍵觸發

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Core Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run yfinance Update & Compatibility Pipeline
        run: |
          python scripts/check_yfinance_update.py --no-commit

      - name: Create dependency update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(deps): auto-update yfinance to latest PyPI release"
          title: "chore(deps): update yfinance"
          body: |
            Automated yfinance update validated by the compatibility pipeline.

            The normal pull-request CI must pass before this change is merged.
          branch: automation/yfinance-update
          delete-branch: true
          add-paths: requirements.txt
